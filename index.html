<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16193a" />
  <!-- SVG untuk browser modern, PNG sebagai cadangan (crawler favicon Google salah satunya). -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="preload" href="/PressStart2P.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arcade Hub" />

  <title>Arcade Hub: Tracker Poin Google Cloud Arcade Fasilitator 2026</title>
  <meta name="description" content="Hitung poin Google Cloud Arcade otomatis dari profil Cloud Skills Boost, pantau milestone fasilitator, tier hadiah, dan leaderboard guild. Gratis untuk komunitas." />

  <!-- Situs ini juga bisa diakses lewat URL deployment Vercel (tracker-*.vercel.app) yang
       berganti tiap deploy. Tanpa canonical, tiap URL itu berpotensi terindeks sebagai halaman
       terpisah dengan isi identik. Sengaja menunjuk domain utama, bukan URL saat ini. -->
  <link rel="canonical" href="https://arcadehub-id.vercel.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Arcade Hub" />
  <meta property="og:title" content="Arcade Hub: Tracker Poin Google Cloud Arcade 2026" />
  <meta property="og:description" content="Hitung poin Arcade otomatis dari profil Cloud Skills Boost, pantau milestone, tier hadiah, dan leaderboard guild." />
  <meta property="og:url" content="https://arcadehub-id.vercel.app/" />
  <meta property="og:image" content="https://arcadehub-id.vercel.app/img/hero.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Arcade Hub: Tracker Poin Google Cloud Arcade 2026" />
  <meta name="twitter:description" content="Hitung poin Arcade otomatis dari profilmu, pantau milestone, tier hadiah, dan leaderboard." />
  <meta name="twitter:image" content="https://arcadehub-id.vercel.app/img/hero.png" />

  <!-- JSON-LD, bukan <script> berisi kode: CSP di vercel.json memakai script-src 'self' tanpa
       nonce, dan itu TIDAK menghalangi type="application/ld+json" karena blok ini data, bukan
       skrip yang dieksekusi. Jangan ubah type-nya jadi text/javascript. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Arcade Hub",
    "url": "https://arcadehub-id.vercel.app/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "inLanguage": "id-ID",
    "description": "Tracker poin Google Cloud Arcade Fasilitator 2026: hitung poin otomatis dari profil Cloud Skills Boost, pantau milestone, tier hadiah, dan leaderboard guild.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
    "isAccessibleForFree": true,
    "license": "https://opensource.org/licenses/MIT"
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Service worker registration lives in src/main.jsx, not inline here, so the
       CSP in vercel.json can keep script-src at 'self' with no hash or nonce. -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
