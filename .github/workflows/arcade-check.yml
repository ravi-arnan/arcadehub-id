name: Cek katalog Arcade

# Arcade rilis game baru tiap awal bulan. Workflow ini dijalankan seperlunya pada
# tanggal 1 dan 2 tiap bulan atau manual via workflow_dispatch.
on:
  schedule:
    - cron: '0 1 1,2 * *' # 08.00 WIB tanggal 1 dan 2 tiap bulan
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bandingkan katalog dengan halaman Arcade resmi
        shell: bash
        run: npm run check:arcade | tee -a "$GITHUB_STEP_SUMMARY"
