# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Concise, direct technical review without fluff or emojis. Focus on TypeScript type safety, boundary checks, and React rendering efficiency."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
