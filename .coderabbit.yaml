# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "id-ID"
tone_instructions: "Gunakan Bahasa Indonesia dicampur istilah teknis Inggris. Berikan review ringkas, lugas, tanpa emoji, dan tanpa basa-basi. Utamakan type safety TypeScript, validasi boundary, keamanan, dan efisiensi render React."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
